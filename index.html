<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Senhas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Gerador de Senhas Seguras</h1>
    <input type="number" id="length" placeholder="Tamanho da senha" min="4" max="32">
    <button onclick="gerarSenha()">Gerar Senha</button>
    <p id="senhaGerada"></p>
  </div>
  <script src="script.js"></script>
</body>
</html>
